# Hyprland rules for wa-notify. Platform-specific by nature: Hyprland on Wayland only.
#
# Add to your config:   source = ~/.config/hypr/conf/wa-reel.conf
#
# Syntax: the `windowrule { ... }` block form used here is for Hyprland >= 0.53. Older versions need the
# `windowrulev2 = ...` form, e.g. (verify against the wiki for your version):
#   windowrulev2 = float, class:^(wa-reel)$
#   windowrulev2 = size 420 750, class:^(wa-reel)$
#   windowrulev2 = pin, class:^(wa-reel)$
#   windowrulev2 = move 72% 15%, class:^(wa-reel)$
#
# These values mirror the defaults of the tools (config.toml [ui]): app_id = "wa-reel",
# player_size = "420x750". If you change them there, change them here too.
# Positions are percentages of the monitor, so the player lands in the same relative spot
# on any resolution.

# Floating reel / photo-post player (mpv is started with --wayland-app-id=wa-reel and --title=wa-reel).
# The two rules cover compositors/backends that only expose one of class or title.
windowrule {
    name = wa-reel-player
    match:class = ^(wa-reel)$
    float = 1
    size = 420 750
    pin = 1
    move = 72% 15%
}

windowrule {
    name = wa-reel-player-title
    match:title = ^(wa-reel)$
    float = 1
    size = 420 750
    pin = 1
    move = 72% 15%
}

# Digest viewer (wa-reel-digest --float opens a floating terminal with this app-id).
windowrule {
    name = wa-reel-digest-rules
    match:class = ^(wa-reel-digest)$
    float = 1
    size = 1000 600
    center = 1
    opacity = 0.85 0.75
}

# Example keybinds (assumes $mainMod / $altMod are defined in your main config).
# ADAPT: the path to wa-reel-menu (see deploy/README.md for the symlink).
# $mainMod = SUPER
# $altMod = ALT
bind = $altMod, R, exec, ~/.local/bin/wa-reel-menu
bind = $mainMod SHIFT, R, exec, ~/.local/bin/wa-reel-menu
