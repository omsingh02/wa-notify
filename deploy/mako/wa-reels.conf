# mako theme for wa-notify notifications. Optional: without it the notifications still work, just unstyled.
#
# Append to ~/.config/mako/config, then run: makoctl reload
#
# The section criterion matches `notify-send -a wa-reels` (config.toml [ui] notify_app_name).
# Two mako gotchas handled below:
#  - mako has no multi-line values: the newline inside `format` is the two characters \n, not a real newline.
#  - `%` is mako's format escape, so a literal percent sign is written %%.

[app-name=wa-reels]
font=monospace 12
format=<b><span size="14pt">%s</span></b>\n<span size="11.5pt" alpha="75%%">%b</span>
border-color=#E1306C
border-size=2
width=400
height=110
padding=16
max-icon-size=64
default-timeout=12000
on-button-left=invoke-default-action
