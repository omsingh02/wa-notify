name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: catches upstream drift (yt-dlp, Node and Python releases) even when nobody pushes.
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

  node:
    name: node (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The server needs node:sqlite without flags, i.e. Node >= 22.13.
        node-version: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check
        run: |
          node --version
          find extension local-server -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      # Explicit globs: Node 22 does not accept directory arguments, and bare `node --test` would also execute test helpers.
      - name: Tests
        run: node --test "extension/test/*.test.js" "local-server/test/*.test.js"

  meta:
    name: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON files
        run: |
          python3 -m json.tool extension/manifest.json > /dev/null
          python3 -m json.tool local-server/package.json > /dev/null
          python3 -m json.tool site/vercel.json > /dev/null

  # One stable check name to require in branch rules, independent of the matrix above.
  ci-ok:
    name: CI passed
    if: always()
    needs: [python, node, meta]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'; then exit 1; fi
