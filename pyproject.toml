[project]
name = "wa-notify"
version = "0.2.0"
description = "Hobby project: personal WhatsApp Web archiver with Instagram reel alerts (Linux/Wayland tools)"
readme = "README.md"
requires-python = ">=3.11"  # tomllib
license = { text = "MIT" }
dependencies = ["yt-dlp"]

[project.optional-dependencies]
rich = ["rich"]  # nicer digest tables / previews (plain text without it)
secretstorage = ["secretstorage"]  # lets yt-dlp unlock Chromium-based browsers' cookies from the GNOME keyring

# The tools are scripts run in place from tools/ (symlinked into ~/.local/bin); this is not a distributable package.

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["tools", "tests"]
extend-exclude = [".backup-*", "site/.vercel", "node_modules"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # import order
  "B",       # flake8-bugbear
  "UP",      # pyupgrade
  "SIM",     # flake8-simplify
  "C4",      # comprehensions
  "PIE",     # misc. anti-patterns
]
ignore = [
  "E501",    # line length: `ruff format` wraps code; what is left are long strings and log messages
]

[tool.ruff.lint.per-file-ignores]
# The CLI scripts put tools/ on sys.path before importing their sibling modules (they run through symlinks in
# ~/.local/bin), and the tests do the same through conftest.py, so imports legitimately follow code.
"tools/*.py" = ["E402"]
# The test harness unpacks (result, stdout, stderr) and often needs only part of it.
"tests/**" = ["E402", "F841", "SIM115"]  # SIM115: the harness writes small files with one-liners

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
